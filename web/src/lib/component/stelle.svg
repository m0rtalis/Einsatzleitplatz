<svg viewBox="-50 -50 100 100" xmlns="http://www.w3.org/2000/svg">
    <style>
        * {
        stroke: black;
        stroke-width: 1;
        }

        text {
        font-family: serif;
        font-size: medium;
        fill: black;
        stroke: black;
        }
    </style>
    <defs>
        <g id="Grundzeichen">
            <circle cx="0" cy="00" r="30" fill="white"/>
        </g>

        <mask id="clip-Zeichen">
            <use href="#Grundzeichen"/>
        </mask>
    </defs>


    <use href="#Grundzeichen"/>

    <g mask="url(#clip-Zeichen)">
        <g id="Organisation">
        </g>
        <g id="Grundeigenschaft">
        </g>
        <g id="Fähigkeiten">
            <path d="M 0,-30
                         v 60
                         m -45,-30
                         h 90
   "/>
            <line id="arztbesetzt" x1="-10" y1="17" x2="10" y2="17"/>
            <g id="Transport">
                <defs>
                    <circle id="transport-circle" cx="0" cy="0" r="15"/>
                </defs>
                <use href="#transport-circle" fill="none"/>
                <mask id="clip-transport">
                    <use href="#transport-circle" fill="white"/>
                </mask>
                <g mask="url(#clip-transport)">
                    <line x1="-50" y1="50" x2="50" y2="-50"/>
                    <line x1="50" y1="50" x2="-50" y2="-50"/>
                </g>
            </g>
        </g>
    </g>
    <g id="Zusatzzeichen" fill="black">
        <circle cx="-20" cy="-40" r="3"/>
        <circle cx="0" cy="-40" r="3"/>
        <circle cx="20" cy="-40" r="3"/>
    </g>
</svg>
