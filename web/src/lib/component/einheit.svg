<svg viewBox="-50 -50 100 100" xmlns="http://www.w3.org/2000/svg">
    <style>
        * {
        stroke: black;
        stroke-width: 1;
        }

        text {
        font-family: serif;
        font-size: medium;
        fill: black;
        stroke: black;
        }
    </style>
    <defs>
        <g id="Grundzeichen">
            <rect x="-45" y="-30" width="90" height="60" fill="white"/>
        </g>

        <mask id="clip-Zeichen">
            <use href="#Grundzeichen"/>
        </mask>
    </defs>

    <use href="#Grundzeichen"/>

    <g mask="url(#clip-Zeichen)">
        <g id="Organisation">
            <text x="11" y="23" textLength="32" lengthAdjust="spacingAndGlyphs">BRK</text>
        </g>
        <g id="Grundeigenschaft">
            <rect x="-45" y="-30" width="90" height="5" fill="black"/>
            <rect x="-45" y="25" width="90" height="5" fill="black"/>
        </g>
        <g id="Fähigkeiten">
            <path d="M 0,-30
                         v 60
                         m -45,-30
                         h 90
   "/>
            <text x="-44" y="-7" textLength="40" lengthAdjust="spacingAndGlyphs">SEG</text>
            <line x1="-10" y1="17" x2="10" y2="17"/>
        </g>
    </g>
    <g id="Zusatzzeichen" fill="black">
        <circle cx="-20" cy="-40" r="3"/>
        <circle cx="0" cy="-40" r="3"/>
        <circle cx="20" cy="-40" r="3"/>
    </g>
</svg>